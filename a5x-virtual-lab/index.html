<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#14284b">
  <title>SRI Public School | Virtual Robotics & Innovation Lab</title>
  <link rel="stylesheet" href="/src/styles.css">
</head>
<body>
  <!-- 3D Canvas -->
  <canvas id="scene"></canvas>

  <!-- ═══ LOADING SCREEN ═══ -->
  <div id="loader">
    <div class="loader-content">
      <div class="loader-logo">
        <span class="loader-brand">SRI</span>
        <span class="loader-sub">Public School</span>
      </div>
      <p class="loader-tagline">Robotics & Innovation Lab</p>
      <div class="loader-bar">
        <div class="loader-bar-fill"></div>
      </div>
      <p class="loader-text">Loading 0%</p>
    </div>
  </div>

  <!-- ═══ INTRO SCREEN (over 3D exterior) ═══ -->
  <div id="intro">
    <div class="intro-content">
      <h1 class="intro-title">SRI <span>Public School</span></h1>
      <p class="intro-subtitle">Robotics & Innovation Lab — Virtual Tour</p>
      <div class="intro-buttons">
        <button id="enterBtn" class="btn-primary">
          <span>Enter Lab</span>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </button>
        <button id="skipBtn" class="btn-ghost">Skip intro ▸▸</button>
      </div>
      <small class="intro-hint">
        Desktop: WASD / arrows + mouse &nbsp;|&nbsp; Mobile: joystick + drag
      </small>
    </div>
  </div>

  <!-- ═══ HUD (visible during free exploration) ═══ -->
  <div id="hud" class="hidden">
    <!-- Crosshair -->
    <div id="crosshair"></div>

    <!-- Zone info card -->
    <div id="zone-card">
      <h2 class="zone-card-title"></h2>
      <p class="zone-card-desc"></p>
    </div>

    <!-- Door / Interaction Prompt -->
    <div id="action-prompt" class="action-prompt hidden">
      <span class="prompt-icon">🚪</span>
      <span class="prompt-text">Press <b>E</b> or Click to open</span>
    </div>

    <!-- Teleport menu -->
    <button id="menu-toggle" class="menu-toggle-btn">☰</button>
    <nav id="menu" class="menu-nav"></nav>

    <!-- Info panel (hotspot details) -->
    <div id="info-panel">
      <button class="info-close">✕</button>
      <h3 class="info-title"></h3>
      <p class="info-desc"></p>
    </div>

    <!-- Minimap -->
    <button id="minimap-toggle" class="minimap-toggle-btn">🗺</button>
    <div id="minimap">
      <canvas id="minimap-canvas"></canvas>
    </div>

    <!-- Sound toggle -->
    <button id="sound-toggle" class="sound-toggle-btn" title="Toggle ambient sound">🔇</button>
  </div>

  <!-- ═══ MOBILE JOYSTICK ═══ -->
  <div id="stick" class="hidden">
    <div class="stick-knob"></div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
